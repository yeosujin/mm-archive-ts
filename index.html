<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#88C9F9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="mmemory" />
    <title>mmemory</title>
    <!-- 앱이 뜨기 전 빈 화면도 저장된 테마 배경으로 (다크 모드에서 흰 화면이 번쩍이지 않게). Layout이 이어서 같은 값을 둔다 -->
    <script>try { if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark'; } catch (e) {}</script>
    <style>html[data-theme="dark"] { background: #0a0a0f; }</style>
    
    <!-- 외부 임베드 스크립트 미리 연결 -->
    <link rel="preconnect" href="https://platform.twitter.com" />
    <link rel="preconnect" href="https://syndication.twitter.com" />
    <link rel="preconnect" href="https://www.instagram.com" />
    <link rel="dns-prefetch" href="https://platform.twitter.com" />
    <link rel="dns-prefetch" href="https://pbs.twimg.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Twitter 위젯 미리 로드 -->
    <script async src="https://platform.twitter.com/widgets.js"></script>
  </body>
</html>
