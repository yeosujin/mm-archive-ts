name: Daily Tweet

on:
  # 정시 게시의 주 경로. Cloudflare Worker가 매일 15:00 UTC(KST 자정)에 쏜다.
  # (workers/daily-tweet-trigger) GitHub schedule과 달리 즉시 실행되므로
  # 스크립트의 자정 대기 없이 곧바로 게시된다.
  repository_dispatch:
    types: [daily-tweet]

  # 이하 schedule은 위 Worker가 죽었을 때를 대비한 예비 경로다.
  # GitHub 스케줄 디스패치는 지연이 크고 불규칙해(상시 60~90분, 2026-08-27~29에는 약 10시간
  # 지연되거나 아예 뜨지 않음) 정시 게시를 기대할 수 없다. 늦게라도 그날 몫이 나가게만 한다.
  # Worker가 이미 게시했으면 tweet_bot_log(dedup)에 걸려 조용히 스킵된다.
  schedule:
    - cron: '50 12 * * *' # 21:50 KST — 주 트리거(지연 2h10m까지 흡수 후 자정 정시 게시)
    - cron: '30 14 * * *' # 23:30 KST — 백업1(지연 30분까지 흡수 후 자정 정시 게시)
    - cron: '10 15 * * *' # 00:10 KST — 백업2(자정 직후 즉시 게시)
    - cron: '10 16 * * *' # 01:10 KST — 백업3
    - cron: '10 18 * * *' # 03:10 KST — 백업4(최후)
  workflow_dispatch: # 수동 실행 허용(대기 없이 즉시 게시)
    inputs:
      dry_run:
        description: '드라이런(게시 안 하고 계획만 출력)'
        type: boolean
        default: false
      force:
        description: '중복 방지 무시하고 강제 재게시'
        type: boolean
        default: false

# 중복 게시 방지의 핵심.
# 게시 여부 판정(alreadyPosted)은 "확인 후 게시"라서, 두 트리거가 나란히 자정까지 대기하다
# 15:00:00에 동시에 깨어나면 둘 다 "아직 안 올림"으로 보고 중복 게시한다.
# 한 번에 하나만 실행시키면 뒤엣것은 앞엣것이 끝난 뒤 시작해 dedup 검사에 정상적으로 걸린다.
# (cancel-in-progress: false — 대기 중인 앞 실행을 취소하면 정시 게시를 놓치므로 취소하지 않는다)
concurrency:
  group: daily-tweet
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VITE_R2_ACCOUNT_ID: ${{ secrets.VITE_R2_ACCOUNT_ID }}
      VITE_R2_ACCESS_KEY_ID: ${{ secrets.VITE_R2_ACCESS_KEY_ID }}
      VITE_R2_SECRET_ACCESS_KEY: ${{ secrets.VITE_R2_SECRET_ACCESS_KEY }}
      VITE_R2_BUCKET_NAME: ${{ secrets.VITE_R2_BUCKET_NAME }}
      VITE_R2_PUBLIC_URL: ${{ secrets.VITE_R2_PUBLIC_URL }}
      X_APP_KEY: ${{ secrets.X_APP_KEY }}
      X_APP_SECRET: ${{ secrets.X_APP_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 플래그는 수동 실행(inputs) 또는 Worker(client_payload) 양쪽에서 올 수 있다.
      # schedule 이벤트에서는 둘 다 비어 있어 플래그 없이 실행된다.
      - run: npx tsx scripts/dailyTweet/index.ts ${{ (inputs.dry_run || github.event.client_payload.dry_run) && '--dry-run' || '' }} ${{ (inputs.force || github.event.client_payload.force) && '--force' || '' }}
